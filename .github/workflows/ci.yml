name: ExpenseFlow CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  sync-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the SDK sync contract tests
        run: pnpm --filter @expenseflow/sdk exec vitest run src/__tests__/client.test.ts --reporter=json --outputFile="$RUNNER_TEMP/sync-contract.json"
      - name: Require all three sync contract cases to execute
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const results = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/sync-contract.json`, 'utf8'));
          const tests = results.testResults.flatMap((suite) => suite.assertionResults);
          const required = [
            'should dispatch pullSync with timestamp and parse server response',
            'normalizes the serverTimestamp from the live sync response into the SDK cursor',
            'rejects a failed sync pull without returning a cursor',
          ];
          for (const title of required) {
            const matches = tests.filter((test) => test.title === title);
            if (matches.length !== 1 || matches[0].status !== 'passed') {
              throw new Error(`Required sync test failed, did not run, or was duplicated: ${title}`);
            }
          }
          JS

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test

      - name: Reject Critical Production Advisories
        run: pnpm audit --prod --audit-level critical

  api-container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build -f apps/api/Dockerfile -t expenseflow-api:ci .
